<script>
'use strict';
(() => {
// ============================================================================
// COOP SWEEP
// A paper pasture hides ten hens. Dig a patch: a number tells you how many
// hens are nesting in the eight patches around it. Flag every hen and dig
// everything else. Dig up a hen and she bolts (BAWK!), ending the run.
//
// Logical space is 128x152: HUD on top, an 8x8 board, the DIG/FLAG toggle at
// the bottom. Everything is drawn as paper cut-outs: flat fills, a thick white
// cut margin, a thin inked edge and a soft drop shadow.
// ============================================================================

const LW = 128, LH = 152, COLS = 8, ROWS = 8, HENS = 10;
const CELL = 13, BX = 12, BY = 26;
const INK = '#3b2a26';
const FONT = '"Arial Rounded MT Bold","Varela Round","Nunito","Trebuchet MS",Verdana,Arial,sans-serif';
const FLIP = 0.2, LONG_PRESS = 380;
const NUM_COL = [null, '#3870c0', '#2f9a3a', '#e02810', '#6a3fb0', '#b0522d', '#16928f', INK, '#7a7a7a'];
const QS = new URLSearchParams(location.search);
const SHOT = QS.has('shot');   // card-image capture: a staged mid-game board, no overlays

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const mmss = t => { t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
// Leaderboard times are the server's measurement in ms: m:ss.t
const mmsst = ms => { const d = Math.floor(ms / 100), s = Math.floor(d / 10); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + '.' + (d % 10); };
const idx = (c, r) => r * COLS + c;
const inB = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS;
function around(i) {
  const c = i % COLS, r = (i / COLS) | 0, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if ((dc || dr) && inB(c + dc, r + dr)) out.push(idx(c + dc, r + dr));
  return out;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
};

// ---------------------------------------------------------------- canvas
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let CW = 1, CH = 1, SC = 1, OX = 0, OY = 0, SPK = 4;
const bg = document.createElement('canvas');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

function resize() {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  CW = cv.width = Math.round(w * dpr); CH = cv.height = Math.round(h * dpr);
  SC = Math.min(CW / (LW + 8), CH / (LH + 8));
  OX = (CW - LW * SC) / 2; OY = (CH - LH * SC) / 2;
  const k = clamp(Math.ceil(SC), 2, 10);
  if (k !== SPK) { SPK = k; CACHE.clear(); }
  drawBG();
}

// ---------------------------------------------------------------- drawing helpers
function rp(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function stroke(g, w = 0.55, col = INK) { g.lineWidth = w; g.strokeStyle = col; g.stroke(); }
function E(g, x, y, rx, ry, f, rot = 0, ns) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fillStyle = f; g.fill(); if (!ns) stroke(g); }
function PL(g, pts, f, ns) {
  g.beginPath(); g.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
  g.closePath(); g.fillStyle = f; g.fill(); if (!ns) stroke(g);
}
function txt(s, x, y, size, fill = '#fff', align = 'center', strokeCol = INK, sw, g = ctx) {
  g.font = `900 ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle';
  if (strokeCol) { g.lineJoin = 'round'; g.lineWidth = sw || size * 0.3; g.strokeStyle = strokeCol; g.strokeText(s, x, y); }
  g.fillStyle = fill; g.fillText(s, x, y);
}
// A sheet of paper: soft drop shadow, cream fill, inked edge.
function paper(x, y, w, h, r = 3, fill = '#fffdf4', edge = INK, g = ctx) {
  g.fillStyle = 'rgba(70,35,20,0.28)'; rp(g, x + 0.9, y + 1.2, w, h, r); g.fill();
  rp(g, x, y, w, h, r); g.fillStyle = fill; g.fill(); stroke(g, 0.7, edge);
}
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// ---------------------------------------------------------------- paper cut-out cache
// Vector art is drawn once at device resolution, then given a white cut margin,
// a thin inked edge and a drop shadow: the paper-craft sticker look.
const CACHE = new Map();
function tint(src, col) {
  const c = mk(src.width, src.height), x = c.getContext('2d');
  x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}
// Turn a canvas of art (with transparent surroundings) into a sticker.
function cutout(base, margin, K, shadow = true) {
  const pad = Math.ceil((margin + 1.6) * K);
  const out = mk(base.width + pad * 2, base.height + pad * 2), o = out.getContext('2d');
  const white = tint(base, '#ffffff'), dark = tint(base, 'rgba(59,42,38,0.95)'), sh = tint(base, 'rgba(60,30,15,0.30)');
  const ring = (img, r, dx = 0, dy = 0) => { for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2; o.drawImage(img, pad + dx + Math.cos(a) * r, pad + dy + Math.sin(a) * r); } };
  if (shadow) ring(sh, margin * K, 0.8 * K, 1.1 * K);
  ring(dark, (margin + 0.45) * K); ring(white, margin * K); o.drawImage(base, pad, pad);
  return { cv: out, pad: pad / K };
}
// art(g) draws into a box of w x h logical units (origin top-left).
function sticker(key, w, h, art, margin = 0.8) {
  const k = key + '@' + SPK;
  let s = CACHE.get(k);
  if (s) return s;
  const base = mk(w * SPK, h * SPK), b = base.getContext('2d');
  b.scale(SPK, SPK); b.lineJoin = 'round'; b.lineCap = 'round';
  art(b);
  const c = cutout(base, margin, SPK);
  s = { cv: c.cv, w: w + c.pad * 2, h: h + c.pad * 2, pad: c.pad };
  CACHE.set(k, s);
  return s;
}
// Draw a sticker centred on (x, y) with optional scale / x-squash (for flips) / rotation.
function put(s, x, y, sc = 1, sx = 1, rot = 0) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(sc * sx, sc);
  ctx.drawImage(s.cv, -s.w / 2, -s.h / 2, s.w, s.h);
  ctx.restore();
}

// ---------------------------------------------------------------- hen art (./hens/)
// One pool of bird art (both sets) from hens/manifest.js. A cell's henIdx points
// into it; if that image hasn't loaded (or failed), another loaded one stands in,
// and with none at all the drawn paper hen does.
const ART = Array.isArray(window.COOP_HENS) ? window.COOP_HENS : [];
const HENIMG = [];
ART.forEach((h, i) => {
  const im = new Image();
  im.onload = () => { HENIMG[i] = im; CACHE.clear(); drawBG(); };
  im.src = 'hens/' + h.file;
});
const artPool = () => Math.max(6, ART.length);
// Fallback hen, drawn here (original art) when no hen files are available.
function drawPaperHen(g, w, h, hue) {
  const cx = w * 0.48, cy = h * 0.56, s = Math.min(w, h) / 20;
  const body = ['#fff7ea', '#f6c26b', '#c97b4a', '#f2f2f2', '#e8a0a0', '#9ccf7a'][hue % 6];
  g.save(); g.translate(cx, cy); g.scale(s, s);
  g.lineWidth = 0.7; g.strokeStyle = INK;
  PL(g, [-6, -1, -9.5, -5, -8.5, 0.5, -10, 2, -6.5, 3], body);                        // tail
  g.beginPath(); g.ellipse(-0.5, 2, 7, 5.5, 0, 0, Math.PI * 2); g.fillStyle = body; g.fill(); g.stroke();
  g.beginPath(); g.ellipse(3.2, -3.6, 3.4, 3.6, 0, 0, Math.PI * 2); g.fill(); g.stroke(); // head
  PL(g, [6.2, -4.2, 9, -3.2, 6.3, -2.4], '#f8b020');                                 // beak
  PL(g, [1.6, -6.6, 2.4, -8.8, 3.4, -7.2, 4.6, -9, 5, -6.6], '#e02810');             // comb
  E(g, 6.1, -1.6, 0.8, 1.1, '#e02810', 0, true);
  E(g, 4.4, -4.2, 0.65, 0.75, INK, 0, true);
  g.beginPath(); g.ellipse(-1.5, 2.4, 3.6, 2.2, -0.3, 0, Math.PI); g.stroke();           // wing
  g.lineWidth = 0.8; g.strokeStyle = '#d88a10';
  g.beginPath(); g.moveTo(-2, 7.2); g.lineTo(-2.2, 9.2); g.moveTo(1.5, 7.2); g.lineTo(1.7, 9.2); g.stroke();
  g.restore();
}
// A hen sticker roughly w logical units tall/wide.
function henSticker(i, size) {
  let k = ((i % artPool()) + artPool()) % artPool();
  if (!HENIMG[k]) { const up = HENIMG.map((m, j) => (m ? j : -1)).filter(j => j >= 0); if (up.length) k = up[k % up.length]; }
  // optional per-image "scale" (0.6..1) in the manifest shrinks a bird, feet kept in place
  const im = HENIMG[k], sc = Math.min(1, Math.max(0.6, Number(ART[k] && ART[k].scale) || 1));
  return sticker(`hen${k}:${size}:${im ? 1 : 0}`, size, size, g => {
    if (im) {
      const f0 = Math.min(size / im.width, size / im.height), f = f0 * sc, foot = (size + im.height * f0) / 2;
      g.drawImage(im, (size - im.width * f) / 2, foot - im.height * f, im.width * f, im.height * f);
    } else drawPaperHen(g, size, size, k);
  }, size > 30 ? 1.4 : 0.9);
}

// ---------------------------------------------------------------- tiles and props
// A grass patch: two checker shades, a lighter fold along the top, a few blades.
function grassTile(shade) {
  return sticker('grass' + shade, CELL - 1.6, CELL - 1.6, g => {
    const w = CELL - 1.6, top = shade ? '#8edb63' : '#7fcf55', low = shade ? '#6fbf47' : '#62b23e';
    const gr = g.createLinearGradient(0, 0, 0, w); gr.addColorStop(0, top); gr.addColorStop(1, low);
    rp(g, 0, 0, w, w, 2); g.fillStyle = gr; g.fill();
    rp(g, 0.6, 0.6, w - 1.2, 2.2, 1.2); g.fillStyle = 'rgba(255,255,255,0.28)'; g.fill();
    g.strokeStyle = 'rgba(40,110,30,0.55)'; g.lineWidth = 0.45;
    const r = seeded(shade ? 11 : 5);
    for (let k = 0; k < 4; k++) {
      const x = 2 + r() * (w - 4), y = 4 + r() * (w - 6);
      g.beginPath(); g.moveTo(x - 0.8, y + 1.4); g.lineTo(x, y); g.lineTo(x + 0.7, y + 1.4); g.stroke();
    }
  }, 0.55);
}
// Dug ground: flat cream paper, slightly sunken (no cut margin, inner shade).
function dugTile(shade) {
  const k = 'dug' + shade + '@' + SPK;
  let s = CACHE.get(k);
  if (s) return s;
  const w = CELL - 0.8, c = mk(w * SPK, w * SPK), g = c.getContext('2d');
  g.scale(SPK, SPK);
  rp(g, 0, 0, w, w, 1.6); g.fillStyle = shade ? '#f7ead0' : '#f1e1c1'; g.fill();
  g.save(); rp(g, 0, 0, w, w, 1.6); g.clip();
  g.fillStyle = 'rgba(120,80,40,0.16)'; g.fillRect(0, 0, w, 0.9); g.fillRect(0, 0, 0.9, w);
  g.restore();
  rp(g, 0, 0, w, w, 1.6); g.lineWidth = 0.35; g.strokeStyle = 'rgba(59,42,38,0.35)'; g.stroke();
  s = { cv: c, w, h: w, pad: 0 };
  CACHE.set(k, s);
  return s;
}
function flagSticker() {
  return sticker('flag', 8, 10, g => {
    g.fillStyle = '#8a5a34'; g.fillRect(2.1, 0.8, 0.9, 8.6);                     // stick
    PL(g, [3, 0.9, 7.6, 2.6, 3, 4.6], '#e8301a', true);                           // pennant
    PL(g, [3, 2.6, 7.6, 2.6, 3, 4.6], 'rgba(120,10,0,0.25)', true);               // fold shade
    g.lineWidth = 0.4; g.strokeStyle = INK; g.beginPath(); g.moveTo(3, 0.9); g.lineTo(7.6, 2.6); g.lineTo(3, 4.6); g.stroke();
    E(g, 2.55, 9.2, 2, 0.7, '#5a8a3a', 0, true);                                   // tuft
  }, 0.7);
}
function numberSticker(n) {
  return sticker('n' + n, 9, 9, g => txt(String(n), 4.5, 4.9, 8.6, NUM_COL[n], 'center', null, 0, g), 0.75);
}

// ---------------------------------------------------------------- background
function drawBG() {
  bg.width = CW; bg.height = CH;
  const g = bg.getContext('2d');
  g.lineJoin = 'round'; g.lineCap = 'round';
  const sky = g.createLinearGradient(0, 0, 0, CH);
  sky.addColorStop(0, '#79c8f8'); sky.addColorStop(1, '#dff4ff');
  g.fillStyle = sky; g.fillRect(0, 0, CW, CH);
  g.save(); g.translate(OX, OY); g.scale(SC, SC);
  const vx0 = -OX / SC, vx1 = (CW - OX) / SC, vy1 = (CH - OY) / SC;
  const rand = seeded(3);
  // paper clouds
  for (let x = vx0 - 10; x < vx1 + 10; x += 34 + rand() * 20) {
    const y = 6 + rand() * 30, s = 0.7 + rand() * 0.6;
    g.fillStyle = 'rgba(60,40,30,0.12)';
    for (const [dx, dy, r] of [[0, 0, 5], [6, -2, 6], [12, 0, 5], [6, 2, 4.5]]) { g.beginPath(); g.arc(x + dx * s + 0.8, y + dy * s + 1, r * s, 0, 7); g.fill(); }
    g.fillStyle = '#ffffff';
    for (const [dx, dy, r] of [[0, 0, 5], [6, -2, 6], [12, 0, 5], [6, 2, 4.5]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, r * s, 0, 7); g.fill(); }
  }
  // two rows of scalloped paper hills
  const hill = (base, amp, col, seed) => {
    const r = seeded(seed);
    g.beginPath(); g.moveTo(vx0 - 5, vy1 + 5);
    for (let x = vx0 - 5; x <= vx1 + 14; x += 14) g.quadraticCurveTo(x + 7, base - amp - r() * amp, x + 14, base);
    g.lineTo(vx1 + 14, vy1 + 5); g.closePath();
    g.save(); g.translate(0.9, 1.2); g.fillStyle = 'rgba(40,60,20,0.2)'; g.fill(); g.restore();
    g.fillStyle = col; g.fill(); g.lineWidth = 0.7; g.strokeStyle = INK; g.stroke();
  };
  hill(70, 8, '#a6dd78', 21);
  hill(98, 7, '#86c95a', 9);
  // wooden fence along the far hill
  for (let x = vx0; x < vx1; x += 9) { g.fillStyle = '#fff3dc'; rp(g, x, 72, 2.4, 9, 0.8); g.fill(); g.lineWidth = 0.4; g.strokeStyle = INK; g.stroke(); }
  g.fillStyle = '#fff3dc'; rp(g, vx0, 74.5, vx1 - vx0, 1.6, 0.6); g.fill(); g.stroke();
  // flowers in the near grass
  for (let k = 0; k < 40; k++) {
    const x = vx0 + rand() * (vx1 - vx0), y = 100 + rand() * (vy1 - 100);
    if (x > BX - 6 && x < BX + COLS * CELL + 6 && y < BY + ROWS * CELL + 8) continue;
    const col = ['#ffffff', '#f8d030', '#f088c0', '#e02810'][k % 4];
    for (let p = 0; p < 5; p++) { const a = p / 5 * 6.283; E(g, x + Math.cos(a) * 1.1, y + Math.sin(a) * 1.1, 0.9, 0.9, col, 0, true); }
    E(g, x, y, 0.6, 0.6, '#f8a020', 0, true);
  }
  // the board's paper mat
  g.fillStyle = 'rgba(70,35,20,0.3)'; rp(g, BX - 4 + 1.2, BY - 4 + 1.6, COLS * CELL + 8, ROWS * CELL + 8, 4); g.fill();
  rp(g, BX - 4, BY - 4, COLS * CELL + 8, ROWS * CELL + 8, 4); g.fillStyle = '#c99a62'; g.fill(); g.lineWidth = 0.8; g.strokeStyle = INK; g.stroke();
  rp(g, BX - 2, BY - 2, COLS * CELL + 4, ROWS * CELL + 4, 3); g.fillStyle = '#e6c793'; g.fill(); g.lineWidth = 0.4; g.stroke();
  g.restore();
}

// ---------------------------------------------------------------- game state
let G = null, clock = 0, uiT = 0, mode = 'dig', sound = store.get('coop-sweep-sound') === 'on';
let best = Number(store.get('coop-sweep-best')) || 0;

function newGame() {
  const cells = [];
  for (let i = 0; i < COLS * ROWS; i++) cells.push({ hen: false, n: 0, open: false, flag: false, flipAt: 0, flagAt: -9, popAt: -1, henIdx: 0, wrong: false });
  return { cells, state: 'ready', t: 0, flags: 0, opened: 0, boom: -1, endAt: 0, paused: false, parts: [], floats: [], shake: 0, playP: null, cur: { c: 3, r: 3 }, kb: false };
}
// Positions come from rand (seeded for the card shot); which bird hides where is a
// shuffled deck of the whole art pool, so a board shows HENS different birds and
// every bird (and both sets) turns up about equally often.
function placeHens(g, safe, rand = Math.random, artRand = Math.random) {
  const banned = new Set([safe, ...around(safe)]);
  const pool = [];
  for (let i = 0; i < g.cells.length; i++) if (!banned.has(i)) pool.push(i);
  const n = artPool(), deck = [...Array(n).keys()];
  for (let k = n - 1; k > 0; k--) { const j = Math.floor(artRand() * (k + 1)); [deck[k], deck[j]] = [deck[j], deck[k]]; }
  for (let k = 0; k < HENS; k++) {
    const j = k + Math.floor(rand() * (pool.length - k));
    [pool[k], pool[j]] = [pool[j], pool[k]];
    rand(); // (kept so seeded boards, like the card shot, stay the same)
    const c = g.cells[pool[k]]; c.hen = true; c.henIdx = deck[k % n];
  }
  g.cells.forEach((c, i) => { c.n = around(i).filter(j => g.cells[j].hen).length; });
}

function reveal(i) {
  const g = G;
  if (g.state === 'won' || g.state === 'lost' || g.paused) return;
  const c = g.cells[i];
  if (c.flag) return;
  if (g.state === 'ready') { placeHens(g, i); g.state = 'play'; trackStart(g); }
  if (c.open) { chord(i); return; }
  if (c.hen) { lose(i); return; }
  // breadth-first dig: empty patches open their neighbours, in a rippling flip
  const seen = new Set([i]), q = [[i, 0]];
  while (q.length) {
    const [j, d] = q.shift(), cj = g.cells[j];
    if (cj.open || cj.flag) continue;
    cj.open = true; cj.flipAt = clock + d * 0.035; g.opened++;
    if (cj.n === 0) for (const k of around(j)) if (!seen.has(k) && !g.cells[k].hen) { seen.add(k); q.push([k, d + 1]); }
  }
  sfx(seen.size > 3 ? 'ripple' : 'dig');
  if (g.opened === COLS * ROWS - HENS) win();
}
// Tap a number whose hens are all flagged: dig the rest of its neighbours.
function chord(i) {
  const g = G, c = g.cells[i];
  if (!c.n) return;
  const ns = around(i), flags = ns.filter(j => g.cells[j].flag).length;

// ---------------------------------------------------------------- play recording
// Uses the optional shared accounts client (../shared/auth.js). Every call is
// guarded and asynchronous, so a missing script or server never affects play.
// Score = whole seconds taken, recorded on a win ('win') and a loss ('loss').
// Lower is better; only wins count as a best (scoreOrder/bestOutcome in

  const p = g.playP; g.playP = null;

// ---------------------------------------------------------------- update
function update(dt) {
  uiT += dt; clock += dt;
  const g = G;
  if (g.state === 'play' && !g.paused) g.t = Math.min(5999, g.t + dt);
  if (g.shake > 0) g.shake = Math.max(0, g.shake - dt);
  for (const p of g.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * dt; p.vx *= 0.985; p.rot += p.vr * dt; }

  if (g.paused) { g.paused = false; return; }
  if (inCircle(BTN.sound, lx, ly)) { sound = !sound; store.set('coop-sweep-sound', sound ? 'on' : 'off'); sfx('flag'); return; }
  if (inCircle(BTN.restart, lx, ly)) { restart(); return; }
  if (LB.ok && inCircle(BTN.board, lx, ly)) { openBoard(null); return; }
  if (inRect(BTN.dig, lx, ly)) { mode = 'dig'; return; }
  if (inRect(BTN.flag, lx, ly)) { mode = 'flag'; return; }
  if (g.state === 'won' || g.state === 'lost') { if (clock - g.endAt > 0.8) restart(); return; }
  act(cellAt(lx, ly), mode);
}
const toLogical = e => {
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) * (cv.width / r.width), py = (e.clientY - r.top) * (cv.height / r.height);
  return [(px - OX) / SC, (py - OY) / SC];
};
let press = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.focus({ preventScroll: true }); } catch (err) { /* old browsers */ }
  G.kb = false;
  const [lx, ly] = toLogical(e);
  if (e.button === 2) { const i = cellAt(lx, ly); if (i >= 0 && !G.paused) act(i, 'flag'); press = null; return; }
  const i = cellAt(lx, ly);
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, lx, ly, fired: false, timer: null };
  // long-press on a patch flags it (when digging) or digs it (when flagging)
  if (i >= 0 && !G.paused && G.state !== 'won' && G.state !== 'lost') {
    const p = press;
    p.timer = setTimeout(() => {
      if (press !== p) return;
      p.fired = true;
      act(i, mode === 'dig' ? 'flag' : 'dig');
      try { if (navigator.vibrate) navigator.vibrate(15); } catch (err) { /* not allowed */ }
    }, LONG_PRESS);
  }
});
cv.addEventListener('pointermove', e => {
  if (press && press.id === e.pointerId && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 12) { clearTimeout(press.timer); press.moved = true; }
});
const endPress = (e, cancel) => {
  if (!press || press.id !== e.pointerId) return;
  clearTimeout(press.timer);
  const p = press; press = null;
  if (!cancel && !p.fired && !p.moved) onTap(p.lx, p.ly);
};
cv.addEventListener('pointerup', e => endPress(e, false));
cv.addEventListener('pointercancel', e => endPress(e, true));
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.target && /^(INPUT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return; // e.g. the sign-in panel
  if (lbOpen()) { if (e.key === 'Escape') window.MembersLeaderboard.close(); return; } // board panel is up
  const g = G, k = e.key;
  const move = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] }[k];
  if (move) { g.kb = true; g.cur = { c: clamp(g.cur.c + move[0], 0, COLS - 1), r: clamp(g.cur.r + move[1], 0, ROWS - 1) }; e.preventDefault(); return; }
  if (g.paused && (k === ' ' || k === 'Enter')) { g.paused = false; e.preventDefault(); return; }
  if (k === ' ' || k === 'Enter') {
    e.preventDefault();
    if (g.state === 'won' || g.state === 'lost') { if (clock - g.endAt > 0.8) restart(); return; }
    g.kb = true; act(idx(g.cur.c, g.cur.r), 'dig');
  } else if (k === 'f' || k === 'F' || k === 'x' || k === 'X') { g.kb = true; act(idx(g.cur.c, g.cur.r), 'flag'); }
  else if (k === 'r' || k === 'R') restart();
  else if (k === 'm' || k === 'M') { sound = !sound; store.set('coop-sweep-sound', sound ? 'on' : 'off'); }
  else if (k === 'l' || k === 'L') openBoard(null);
});
window.addEventListener('resize', resize);
// Pause on tab hide: the clock stops, the board is covered, a tap resumes.
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') G.paused = true; });
window.addEventListener('blur', () => { if (G.state === 'play' && document.hidden) G.paused = true; });

// ---------------------------------------------------------------- boot
G = newGame();
if (SHOT) {
  // staged board for the card image: a dug-out middle, two flags, one hen up
  const r = seeded(42);
  placeHens(G, idx(3, 4), r, seeded(7));
  G.state = 'play'; G.t = 37;
  reveal(idx(3, 4));
  G.cells.forEach(c => { c.flipAt = -9; });
  let flagged = 0;
  G.cells.forEach((c, i) => { if (c.hen && flagged < 2 && around(i).some(j => G.cells[j].open)) { c.flag = true; c.flagAt = -9; G.flags++; flagged++; } });
  const h = G.cells.findIndex(c => c.hen && !c.flag);
  if (h >= 0) { G.cells[h].popAt = 0; G.cells[h].henIdx = 3; }
  G.paused = true; // freeze the clock at 0:37 (the paused overlay is never drawn in shot mode)
}
resize();
// The optional scripts are async; once the page has loaded, see if there's a board.
if (document.readyState === 'complete') lbInit(); else window.addEventListener('load', lbInit);
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Test hooks: lets an automated check drive the real game without a screen.
window.__CS = {
  get G() { return G; }, get mode() { return mode; }, get sound() { return sound; }, get best() { return best; },
  COLS, ROWS, HENS, idx, tap: onTap, reveal: i => act(i, 'dig'), flag: i => act(i, 'flag'), restart,
  cellCenter, step(sec, dt = 1 / 60) { for (let t = 0; t < sec; t += dt) update(dt); render(); },
  screen(lx, ly) { const r = cv.getBoundingClientRect(); return [(OX + lx * SC) * r.width / cv.width + r.left, (OY + ly * SC) * r.height / cv.height + r.top]; },
  henImagesLoaded: () => HENIMG.filter(Boolean).length, ART,
  artOf: i => { const c = G.cells[i]; return c && c.hen ? (ART[c.henIdx] || { file: null, name: 'paper hen' }) : null; },
  deal() { const g = newGame(); placeHens(g, idx(3, 4)); return g.cells.filter(c => c.hen).map(c => ART[c.henIdx] || { file: 'paper' + c.henIdx }); },
  get lbReady() { return LB.ok; }, openBoard, BTN,
};
})();
</script>
