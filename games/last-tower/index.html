<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Last Tower</title>
<meta name="description" content="Last Tower: Chikn Edition. A fast run-and-gun: the farm has turned and the undead flock comes in swarms. Run with the D-pad, aim and shoot with the four-way compass SHOOT pad (hold a direction to keep firing, press two at once for a diagonal; your best gun auto-equips). No jumping, no eating, no healing: life only drops when a hit lands, and every hit counts. Zombie hens lunge-peck, roostrs stomp, egg-slingers lob rotten eggs. Just run, shoot and try not to die. Billions must bok.">

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08d14a; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  /* #stage is the square game screen: a centred square by default; the handheld shell moves it into its screen. */
  #stage { position: fixed; left: 50%; top: 50%; width: min(100vw, 100vh); height: min(100vw, 100vh); transform: translate(-50%, -50%); overflow: hidden; background: #000; }
  html.lt-shell #stage { position: relative; left: auto; top: auto; transform: none; width: 100%; height: 100%; }
  html.lt-touch:not(.lt-shell) #stage { top: calc(env(safe-area-inset-top) + 8px); transform: translate(-50%, 0); }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #nogl { display: none; position: fixed; inset: 0; z-index: 50; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #e8d6a8; background: #0c0a0e; font: 16px/1.5 monospace; }
  /* Touch controls only on touch screens WITHOUT the shell (?handheld=0). */
  #touch { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none; }
  html.lt-touch:not(.lt-shell) #touch { display: block; }
  #tStick { position: absolute; left: 0; bottom: 0; width: 55%; height: 45%; pointer-events: auto; touch-action: none; }
  #tBase { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid #090b0a; background: rgba(248,245,233,.35); left: 90px; top: 60%; }
  #tKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: #ffc42f; border: 3px solid #090b0a; }
  .tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 3px solid #090b0a; color: #090b0a; font: 900 22px "Arial Black", Impact, sans-serif; background: rgba(248,245,233,.85); padding: 0; box-shadow: 3px 4px 0 #090b0a; }
  .tb.on { background: #ffc42f; color: #090b0a; transform: translate(2px, 3px); box-shadow: 1px 1px 0 #090b0a; }
  /* v10: compass SHOOT pad (N/E/S/W) replaces A/B. No flap, no eat. */
  #tShoot { position: absolute; width: 176px; height: 176px; right: calc(14px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); pointer-events: auto; touch-action: none; border-radius: 50%; background: rgba(9,11,10,.18); }
  #tShoot .tb { width: 60px; height: 60px; pointer-events: none; background: rgba(255,51,71,.9); color: #fff; font-size: 18px; }
  #tShoot .tb.on { background: #ffc42f; color: #090b0a; }
  #tSU { left: 58px; top: 0; } #tSD { left: 58px; bottom: 0; } #tSL { left: 0; top: 58px; } #tSR { right: 0; top: 58px; }
  #tBar { position: absolute; right: calc(12px + env(safe-area-inset-right)); bottom: calc(212px + env(safe-area-inset-bottom)); display: flex; gap: 8px; pointer-events: none; }
  #tBar .tb { position: static; pointer-events: auto; }
  #skinLayer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  #skinLayer .sk { position: absolute; display: none; object-fit: contain; image-rendering: auto; -webkit-user-drag: none; }
  #skinLayer .sk-face { background: url(skin/faces.png) 0 0 / 400% 100% no-repeat; }
  #skinLayer img[data-k="title"], #skinLayer img[data-k="dead"], #skinLayer img[data-k="pause"] { filter: drop-shadow(2px 3px 0 rgba(9, 11, 10, .85)); }
</style>
<link rel="stylesheet" href="skin/hens-skin.css?v=11">
</head>
<body>
<div id="stage">
  <canvas id="c" width="256" height="256"></canvas>
  <!-- v11 hens.farm skin: real hens.farm art drawn crisp over the pixel canvas (placed by game.js in canvas coordinates) -->
  <div id="skinLayer"><div class="sk sk-face" data-k="face"></div><img class="sk" data-k="title" src="skin/boxer.png" alt=""><img class="sk" data-k="dead" src="skin/confused.png" alt=""><img class="sk" data-k="pause" src="skin/detective.png" alt=""><img class="sk" data-k="egg" src="skin/egg.png" alt=""></div>
</div>
<div id="touch">
  <div id="tStick"><div id="tBase"><div id="tKnob"></div></div></div>
  <div id="tShoot"><button id="tSU" class="tb">N</button><button id="tSR" class="tb">E</button><button id="tSD" class="tb">S</button><button id="tSL" class="tb">W</button></div>
  <div id="tBar"><button id="tBag" class="tb" style="border-radius:16px;padding:8px 14px;font-size:14px">BAG</button></div>
</div>
<script src="game.js"></script>
<!-- Handheld shell, Last Tower only (v10): data-pad="compass" swaps A/B for a 4-way SHOOT pad (N/E/S/W = i/l/k/j, hold to aim + fire).
     D-pad = WASD (run). START = Enter and SELECT = Escape both pause. No jump, no eat. Best weapon auto-equips.
     ?handheld=0 opts out (touch: stick + the same compass pad). -->
<script src="../shared/handheld/handheld.js" data-screen="#stage" data-aspect="1" data-name="LAST TOWER" data-theme="matcha" data-pad="compass"
        data-keys='{"up":"w","down":"s","left":"a","right":"d","start":"Enter","select":"Escape","su":"i","sd":"k","sl":"j","sr":"l"}'
        data-labels='{"select":"PAUSE","pad":"SHOOT"}'></script>
<script src="skin/hens-skin.js?v=11"></script>
</body>
</html>
