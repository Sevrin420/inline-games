name: Leaderboard admin (manual)

# List recent leaderboard entries, or remove one (a bad name). Talks to the API
# on the VPS itself (127.0.0.1:3100) with ADMIN_TOKEN read from
# /etc/inline-games-api.env on the server; the token never leaves the box and
# is never printed.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list = show the latest entries with their ids; remove = hide one entry'
        type: choice
        options: [list, remove]
        default: list
      game:
        description: 'Game id'
        type: choice
        options: [coop-sweep]
        default: coop-sweep
      entry_id:
        description: 'Entry id to remove (from "list"); ignored for list'
        required: false
        default: ''

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Check inputs
        env:
          ACTION: ${{ inputs.action }}
          GAME: ${{ inputs.game }}
          ENTRY: ${{ inputs.entry_id }}
        run: |
          [[ "$ACTION" =~ ^(list|remove)$ ]] || { echo "::error::bad action"; exit 1; }
          [[ "$GAME" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "::error::bad game id"; exit 1; }
          if [ "$ACTION" = remove ] && ! [[ "$ENTRY" =~ ^[0-9]{1,12}$ ]]; then echo "::error::entry_id must be a number"; exit 1; fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          CFG
          chmod 600 ~/.ssh/config
          for i in 1 2 3 4 5 6; do
            if ssh vps true; then break; fi
            [ "$i" = 6 ] && { echo "::error::Could not reach the VPS"; exit 1; }
            sleep $((i * 15))
          done

      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          GAME: ${{ inputs.game }}
          ENTRY: ${{ inputs.entry_id }}
        run: |
          # Inputs were validated above; re-check what goes into the remote command line.
          [[ "$ACTION" =~ ^(list|remove)$ && "$GAME" =~ ^[a-z0-9-]{1,40}$ ]] || exit 1
          [ "$ACTION" = remove ] || ENTRY=0
          [[ "$ENTRY" =~ ^[0-9]{1,12}$ ]] || exit 1
          ssh vps "ACTION=$ACTION GAME=$GAME ENTRY=$ENTRY bash -s" <<'REMOTE'
          set -euo pipefail
          TOKEN=$(sed -n 's/^ADMIN_TOKEN=//p' /etc/inline-games-api.env | tail -1)
          [ -n "$TOKEN" ] || { echo "No ADMIN_TOKEN in /etc/inline-games-api.env (run Deploy accounts API)"; exit 1; }
          ORIGIN=$(sed -n 's/^PUBLIC_ORIGIN=//p' /etc/inline-games-api.env | tail -1)
          # The token goes to curl on stdin, so it never shows up in ps or logs.
          if [ "$ACTION" = list ]; then
            printf 'X-Admin-Token: %s\n' "$TOKEN" | curl -sS -H @- "http://127.0.0.1:3100/plays/leaderboard/$GAME/admin?limit=100" \
              | /opt/inline-games-node/bin/node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.entries){console.log(s);process.exit(1)}for(const e of j.entries)console.log([`#${e.id}`,e.name,(e.value/1000).toFixed(1)+"s",e.created_at,e.removed_at?"REMOVED "+e.removed_at:""].join("  "))})'
          else
            printf 'X-Admin-Token: %s\n' "$TOKEN" | curl -sS -X DELETE -H @- -H "Origin: $ORIGIN" "http://127.0.0.1:3100/plays/leaderboard/$GAME/entries/$ENTRY"; echo
          fi
          REMOTE
